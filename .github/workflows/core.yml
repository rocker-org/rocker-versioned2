name: Build & Push Core images

on:
  push:
    branches:
      - "master"
    paths:
      - "dockerfiles/*_devel.Dockerfile"
      - "bakefiles/[0-9]*.docker-bake.json"
  workflow_run:
    workflows:
      - "Create new release"
    branches:
      - "master"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
      rstudio-versions: ${{ steps.matrix.outputs.rstudio-versions }}
      smoke-versions: ${{ steps.matrix.outputs.smoke-versions }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - name: Select source revision
        id: revision
        run: |
          REVISION="${{ github.sha }}"
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            REVISION="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "revision=${REVISION}" >>"${GITHUB_OUTPUT}"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.revision.outputs.revision }}
          fetch-depth: 0
      - name: Select version matrix
        id: matrix
        run: |
          JSON=build/matrix/latest.json
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            JSON=build/matrix/all.json
          fi
          jq -e '.group == ["default"] and (.r_version | length > 0)' "${JSON}" >/dev/null
          VERSIONS=$(jq -c '.r_version' "${JSON}")
          RECOVERED='[]'
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ steps.revision.outputs.revision }}"
            RECOVERED=$(bash build/scripts/core-rstudio-versions.sh "${BEFORE}" "${AFTER}")
            if git diff --quiet "${BEFORE}" "${AFTER}" -- 'dockerfiles/*_devel.Dockerfile'; then
              VERSIONS='[]'
            fi
          fi
          echo "versions=${VERSIONS}" >>"${GITHUB_OUTPUT}"
          RSTUDIO_VERSIONS=()
          while IFS= read -r version; do
            if jq -e '.target | has("rstudio")' "bakefiles/${version}.docker-bake.json" >/dev/null; then
              RSTUDIO_VERSIONS+=("${version}")
            fi
          done < <(jq -r '.[]' <<<"${VERSIONS}")
          RSTUDIO=$(jq -cn --args '$ARGS.positional' "${RSTUDIO_VERSIONS[@]}")
          RSTUDIO=$(jq -cn --argjson normal "${RSTUDIO}" --argjson recovered "${RECOVERED}" '$normal + $recovered | unique')
          echo "rstudio-versions=${RSTUDIO}" >>"${GITHUB_OUTPUT}"
          echo "smoke-versions=$(jq -cn --argjson normal "${VERSIONS}" --argjson rstudio "${RSTUDIO}" '$normal + $rstudio | unique')" >>"${GITHUB_OUTPUT}"

  r-ver:
    if: needs.prepare.outputs.versions != '[]'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/core-target.yml
    with:
      version: ${{ matrix.version }}
      target: r-ver
      revision: ${{ needs.prepare.outputs.revision }}
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  rstudio:
    needs:
      - prepare
      - r-ver
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.r-ver.result == 'success' || needs.r-ver.result == 'skipped') &&
      needs.prepare.outputs.rstudio-versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.rstudio-versions) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/core-target.yml
    with:
      version: ${{ matrix.version }}
      target: rstudio
      revision: ${{ needs.prepare.outputs.revision }}
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  tidyverse:
    needs:
      - prepare
      - rstudio
    if: >-
      !cancelled() && needs.rstudio.result == 'success' &&
      needs.prepare.outputs.rstudio-versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.rstudio-versions) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/core-target.yml
    with:
      version: ${{ matrix.version }}
      target: tidyverse
      revision: ${{ needs.prepare.outputs.revision }}
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  shiny:
    needs:
      - prepare
      - r-ver
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/core-target.yml
    with:
      version: ${{ matrix.version }}
      target: shiny
      revision: ${{ needs.prepare.outputs.revision }}
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  shiny-verse:
    needs:
      - prepare
      - shiny
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/core-target.yml
    with:
      version: ${{ matrix.version }}
      target: shiny-verse
      revision: ${{ needs.prepare.outputs.revision }}
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  verse:
    needs:
      - prepare
      - tidyverse
    if: >-
      !cancelled() && needs.tidyverse.result == 'success' &&
      needs.prepare.outputs.rstudio-versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.rstudio-versions) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/core-target.yml
    with:
      version: ${{ matrix.version }}
      target: verse
      revision: ${{ needs.prepare.outputs.revision }}
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  geospatial:
    needs:
      - prepare
      - verse
    if: >-
      !cancelled() && needs.verse.result == 'success' &&
      needs.prepare.outputs.rstudio-versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.rstudio-versions) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/core-target.yml
    with:
      version: ${{ matrix.version }}
      target: geospatial
      revision: ${{ needs.prepare.outputs.revision }}
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  smoke-test:
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.smoke-versions != '[]'
    needs:
      - prepare
      - r-ver
      - rstudio
      - tidyverse
      - shiny
      - shiny-verse
      - verse
      - geospatial
    name: Smoke ${{ matrix.image.target }} ${{ matrix.image.platform }} R ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.smoke-versions) }}
        image:
          - target: r-ver
            platform: linux/amd64
            runner: ubuntu-24.04
          - target: r-ver
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - target: rstudio
            platform: linux/amd64
            runner: ubuntu-24.04
          - target: rstudio
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - target: tidyverse
            platform: linux/amd64
            runner: ubuntu-24.04
          - target: tidyverse
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - target: shiny
            platform: linux/amd64
            runner: ubuntu-24.04
          - target: shiny-verse
            platform: linux/amd64
            runner: ubuntu-24.04
          - target: verse
            platform: linux/amd64
            runner: ubuntu-24.04
          - target: geospatial
            platform: linux/amd64
            runner: ubuntu-24.04
          - target: geospatial
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.image.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - name: Check published target
        id: available
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          TARGET="${{ matrix.image.target }}"
          if jq -e --arg target "${TARGET}" '.[$target].result == "success"' <<<"${RESULTS}" >/dev/null &&
             jq -e --arg target "${TARGET}" '.target | has($target)' "bakefiles/${{ matrix.version }}.docker-bake.json" >/dev/null; then
            echo "available=true" >>"${GITHUB_OUTPUT}"
          fi
      - name: Login to Docker Hub
        if: steps.available.outputs.available == 'true'
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Pull and run R on the native runner
        if: steps.available.outputs.available == 'true'
        run: |
          build/scripts/core-publish.sh smoke \
            "bakefiles/${{ matrix.version }}.docker-bake.json" \
            "${{ matrix.image.target }}" \
            "${{ matrix.image.platform }}" \
            "${{ needs.prepare.outputs.revision }}"
