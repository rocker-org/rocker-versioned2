name: test for docker-bake.json

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master
    paths:
      - bakefiles/*.json
      - build/matrix/*.json
      - build/templates/bakefiles/*.json
      - build/scripts/core-publish.sh
      - build/scripts/test-core-publish.sh
      - build/scripts/test-core-workflow.sh
      - .github/workflows/core.yml
      - .github/workflows/core-target.yml
      - .github/workflows/bakefile-test.yml
      - Makefile
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Run make test
        run: make test
