name: test for docker-bake.json

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master
    paths:
      - bakefiles/*.json
      - build/matrix/*.json
      - build/templates/bakefiles/*.json
      - build/scripts/generate-*.R
      - build/scripts/test-release-generation.R
      - build/variables/*.tsv
      - build/templates/dockerfiles/*.txt
      - scripts/install_rstudio.sh
      - build/scripts/core-rstudio-versions.sh
      - build/scripts/test-core-rstudio-versions.sh
      - build/scripts/core-publish.sh
      - build/scripts/test-core-publish.sh
      - build/scripts/test-core-workflow.sh
      - .github/workflows/core.yml
      - .github/workflows/core-target.yml
      - .github/workflows/bakefile-test.yml
      - Makefile
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Run make test
        run: make test

  release-generation:
    runs-on: ubuntu-latest
    container:
      image: rocker/tidyverse:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install generator dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq
          install2.r --error --skipinstalled dplyr tidyr purrr readr stringr glue fs jsonlite httr2
      - name: Run offline release generation regressions
        run: Rscript build/scripts/test-release-generation.R
